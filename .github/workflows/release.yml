name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — validate without publishing"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Gate: full CI suite must pass before any release
  # ---------------------------------------------------------------
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------
  # Publish crates to crates.io (topological order)
  # ---------------------------------------------------------------
  publish:
    name: Publish Crates to crates.io
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish config-schema (no workspace deps)
        run: cargo publish -p config-schema --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 15

      - name: Publish pheno-config
        run: cargo publish -p pheno-config --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 15

      - name: Publish settly
        run: cargo publish -p settly --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 15

      - name: Publish phenotype-config-loader
        run: cargo publish -p phenotype-config-loader --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 15

      - name: Publish configra-ops
        run: cargo publish -p configra-ops --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 15

      - name: Publish phenoctl (CLI)
        run: cargo publish -p phenoctl --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------
  # GitHub Release (tag only — no binaries for a config library)
  # ---------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
